<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DisputeShield · AI dispute defence for PayPal merchants</title>
  <meta name="description" content="DisputeShield reads your PayPal disputes, builds the case from PayPal's own records, drafts the response with Google Gemini and submits it after your approval." />
  <meta name="theme-color" content="#EDF0EA" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@33.3.2/dist/ag-grid-community.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="root" aria-live="polite">
    <div class="boot"><div class="boot-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 4 6.5v8.2c0 7.3 5.1 13.6 12 15.3 6.9-1.7 12-8 12-15.3V6.5L16 2Z" fill="#121512"/><path d="m11 16 3.4 3.4L21.5 12" fill="none" stroke="#D8F36A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
  </div>

  <div class="modal hidden" id="paymentModal" role="dialog" aria-modal="true" aria-labelledby="pmTitle">
    <form class="modal-card" id="paymentForm">
      <div class="modal-head">
        <div>
          <span class="eyebrow">PayPal Orders v2 · sandbox</span>
          <h3 id="pmTitle">Take a sandbox payment</h3>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
      </div>
      <p class="muted small">Creates a real PayPal sandbox order. Approve it as a sandbox <b>Personal</b> buyer in the same currency region as your store (a US buyer for USD). DisputeShield captures it and adds your tracking number to the PayPal order.</p>
      <div class="form-grid">
        <label class="field span-2">Product<input class="input" name="product" value="Aurora Wireless Headphones" required maxlength="120" /></label>
        <label class="field">Amount (<span id="pmCurrency">USD</span>)<input class="input" name="amount" type="number" min="1" max="10000" step="0.01" value="89.00" required /></label>
        <label class="field">Carrier<input class="input" name="carrier" value="UPS" maxlength="40" placeholder="UPS, USPS, FedEx, DHL…" /></label>
        <label class="field">Tracking number<input class="input" name="trackingNumber" maxlength="60" placeholder="Leave empty if not shipped yet" /></label>
        <label class="field">Shipped on<input class="input" name="shippedAt" type="date" /></label>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-ink" id="pmSubmit">Continue to PayPal <span class="arrow">→</span></button>
      </div>
    </form>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
